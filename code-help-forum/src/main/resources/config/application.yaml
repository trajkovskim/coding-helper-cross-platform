server:
  port: 3001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/code_help
    username: user
    password: password
    hikari:
      maximum-pool-size: 10
      schema: forum
  flyway:
    default-schema: forum
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: forum
        connection:
          autocommit: false
        format_sql: true
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://10.0.2.2/iam/realms/code-help
          jwk-set-uri: http://localhost/iam/realms/code-help/protocol/openid-connect/certs
