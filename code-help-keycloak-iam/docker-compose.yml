version: '3'
services:
  keycloak_iam:
    image: keycloak/keycloak:21.0
    container_name: code-help_keycloak_iam
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=10.0.2.2
    command: start-dev --import-realm
    volumes:
      - ./realms:/opt/keycloak/data/import

  