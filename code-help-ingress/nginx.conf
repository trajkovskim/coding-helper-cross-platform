events {
  worker_connections 1024;
}

http {
  include /etc/nginx/conf.d/*.conf;

  server {
    listen 80;
    server_name _;

    location /core/ {
      proxy_pass "http://code-help-core:3000/";
    }

    location /forum/ {
      proxy_pass "http://code-help-forum:3001/";
    }

    location /iam {
      proxy_pass "http://code-help-keycloak-iam:8080";
    }
  }
}
