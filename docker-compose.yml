version: '3'
services:
  code-help-ingress:
    image: nginx
    container_name: code-help-ingress
    build:
      dockerfile: code-help-ingress\Dockerfile
      context: .\
    ports:
      - 80:80
      - 433:433
    depends_on:
      - code-help-core
      - code-help-forum
      - code-help-keycloak-iam

  code-help-keycloak-iam:
    image: quay.io/keycloak/keycloak:20.0.3
    container_name: code-help-keycloak-iam
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=10.0.2.2
    command: start-dev --import-realm
    volumes:
      - ./code-help-keycloak-iam/realms:/opt/keycloak/data/import

  code-help-core:
    image: code-help-core
    container_name: code-help-core
    build:
      dockerfile: code-help-core\Dockerfile
      context: .\
    ports:
      - 3000:3000
    depends_on:
      - code-help-core-neo4j

  code-help-forum:
    image: code-help-forum
    container_name: code-help-forum
    build:
      dockerfile: code-help-forum\Dockerfile
      context: .\
    ports:
      - 3001:3001
    depends_on:
      - code-help-forum-postgres

  code-help-forum-postgres:
    image: postgres:15.1-alpine
    container_name: code-help-forum-postgres
    environment:
      - POSTGRES_DB=code_help
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    volumes:
      - code-help-forum-postgres-data:/var/lib/postgresql/data

  code-help-core-neo4j:
    image: neo4j:5.2.0
    hostname: neo4j
    container_name: code-help-core-neo4j
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - code-help-core-neo4j-data:/data
      - code-help-core-neo4j-plugins:/plugins
      - code-help-core-neo4j-logs:/logs

volumes:
  code-help-forum-postgres-data:
  code-help-core-neo4j-data:
  code-help-core-neo4j-logs:
  code-help-core-neo4j-plugins:
