version: '3'
services:
  code-help-ingress:
    image: legendmt25/code-help:ingress-latest
    container_name: code-help-ingress
    ports:
      - 80:80
      - 433:433
    depends_on:
      - code-help-core
      - code-help-forum
      - code-help-keycloak-iam

  code-help-keycloak-iam:
    image: keycloak/keycloak:21.0
    container_name: code-help-keycloak-iam
    ports:
      - 8443:8443
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command:
      - start-dev
      - --http-relative-path=/iam
      - --proxy=edge
      - --hostname-url=http://<domain>/iam
      - --hostname-admin-url=http://<domain>/iam

  code-help-core:
    image: legendmt25/code-help:core-latest
    container_name: code-help-core
    ports:
      - 3000:3000
    depends_on:
      - code-help-core-neo4j

  code-help-forum:
    image: legendmt25/code-help:forum-latest
    container_name: code-help-forum
    ports:
      - 3001:3001
    depends_on:
      - code-help-forum-postgres

  code-help-forum-postgres:
    image: postgres:15.1-alpine
    container_name: code-help-forum-postgres
    environment:
      - POSTGRES_DB=code_help
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432

  code-help-core-neo4j:
    image: neo4j:5.2.0
    hostname: neo4j
    container_name: code-help-core-neo4j
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/password
