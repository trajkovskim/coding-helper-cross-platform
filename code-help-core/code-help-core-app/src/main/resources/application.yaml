server:
  port: 3000

spring:
  mvc:
    static-path-pattern: /public/**
    hiddenmethod:
      filter:
        enabled: true
    pathmatch:
      matching-strategy: ant_path_matcher
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://10.0.2.2:8080/realms/code-help
          jwk-set-uri: http://localhost:8080/realms/code-help/protocol/openid-connect/certs

  neo4j:
    authentication:
      username: neo4j
      password: password
    uri: bolt://localhost:7687

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  show-actuator: true

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web: DEBUG

compilers:
  javascript:
    ext: .js
    compiler: node.exe
